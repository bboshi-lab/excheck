name: Deploy mock demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 변경 범위 판별
        id: changes
        run: node scripts/classify-changes.mjs
      - name: 문서 전용 배포 생략 기록
        if: steps.changes.outputs.docs_only == 'true'
        run: echo '문서 전용 변경이므로 앱 빌드와 배포를 생략합니다.'
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.docs_only != 'true'
      - run: pnpm format:check
        if: steps.changes.outputs.docs_only != 'true'
      - run: pnpm check
        if: steps.changes.outputs.docs_only != 'true'
        env:
          VITE_API_MODE: mock
          BASE_PATH: /excheck/
      - run: pnpm worker:check
        if: steps.changes.outputs.docs_only != 'true'
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.changes.outputs.docs_only != 'true'
      - run: pnpm exec playwright test
        if: steps.changes.outputs.docs_only != 'true'
        env:
          BASE_PATH: /excheck/
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
